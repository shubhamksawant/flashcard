{% extends "base.html" %}

{% block content %}
<div class="study-container">
    <!-- Header with Home button and Topic -->
    <div class="header-nav">
        <a href="/" class="home-btn">← Back to Home</a>
        <h2>{{ topic.upper() }} Flashcards</h2>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar">
        <div id="progress" style="width: 0%"></div>
    </div>

    {% if cards %}
        <!-- Flashcard -->
        <div class="flashcard" id="currentCard">
            <div class="card-inner">
                <div class="card-front">
                    <p class="question"></p>
                    <p class="flip-hint">(Click card to reveal answer)</p>
                </div>
                <div class="card-back">
                    <p class="answer"></p>
                    <div class="examples"></div>
                    <div class="resources"></div>
                    <p class="rating-prompt">How well did you know this?</p>
                    <div class="confidence-buttons">
                        <button onclick="rateCard('hard')" class="hard-btn">
                            Hard 😟
                            <span class="rating-desc">Review again soon</span>
                        </button>
                        <button onclick="rateCard('medium')" class="medium-btn">
                            Medium 😐
                            <span class="rating-desc">Review in a while</span>
                        </button>
                        <button onclick="rateCard('easy')" class="easy-btn">
                            Easy 😊
                            <span class="rating-desc">You know this well</span>
                        </button>
                    </div>
                    <div id="next-review" class="next-review"></div>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="navigation">
            <button onclick="prevCard()" id="prevBtn">← Previous</button>
            <span id="card-counter">1/{{ cards|length }}</span>
            <button onclick="nextCard()" id="nextBtn">Next →</button>
        </div>
    {% else %}
        <div class="no-cards">
            <p>No flashcards available for this topic yet.</p>
        </div>
    {% endif %}
</div>

<style>
.study-container {
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
}

.header-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.home-btn {
    padding: 10px 20px;
    background: #4CAF50;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}

.progress-bar {
    width: 100%;
    height: 10px;
    background: #eee;
    border-radius: 5px;
    margin-bottom: 20px;
}

#progress {
    height: 100%;
    background: #4CAF50;
    border-radius: 5px;
    transition: width 0.3s ease;
}

.flashcard {
    width: 100%;
    height: 400px;
    perspective: 1000px;
    margin: 20px 0;
}

.card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.8s;
    transform-style: preserve-3d;
    cursor: pointer;
}

.flashcard.flipped .card-inner {
    transform: rotateY(180deg);
}

.card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    background: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.card-back {
    transform: rotateY(180deg);
}

.question, .answer {
    font-size: 24px;
    margin-bottom: 20px;
    color: #333;
}

.flip-hint {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    color: #666;
    font-style: italic;
}

.navigation {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 20px;
}

.navigation button {
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background: #4CAF50;
    color: white;
    transition: background-color 0.3s;
}

.navigation button:hover {
    background: #45a049;
}

#card-counter {
    font-size: 18px;
    color: #666;
}

/* Rating buttons styles */
.confidence-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
}

.confidence-buttons button {
    padding: 15px 25px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 120px;
}

.rating-desc {
    font-size: 0.8em;
    margin-top: 5px;
    opacity: 0.9;
}

.hard-btn {
    background: #ff4444;
    color: white;
}

.medium-btn {
    background: #ffbb33;
    color: white;
}

.easy-btn {
    background: #00C851;
    color: white;
}

.rating-prompt {
    text-align: center;
    margin: 20px 0;
    font-size: 1.1em;
    color: #333;
}

.next-review {
    text-align: center;
    margin-top: 15px;
    font-style: italic;
    color: #666;
}
</style>

<script>
const cardsData = {{ cards|tojson|safe }};
let currentCardIndex = 0;
let reviewSchedule = {};

function showCard(index) {
    const card = cardsData[index];
    document.querySelector('.question').textContent = card.question;
    document.querySelector('.answer').textContent = card.answer;
    
    // Update counter and progress
    document.querySelector('#card-counter').textContent = `${index + 1}/${cardsData.length}`;
    document.querySelector('#progress').style.width = `${((index + 1) / cardsData.length) * 100}%`;
    
    // Reset flip state and feedback
    document.querySelector('.flashcard').classList.remove('flipped');
    document.getElementById('next-review').textContent = '';
    
    // Show review status if available
    const reviewInfo = reviewSchedule[card.id];
    if (reviewInfo) {
        const nextReview = new Date(reviewInfo.nextReview);
        if (nextReview > new Date()) {
            document.getElementById('next-review').textContent = 
                `Next review: ${nextReview.toLocaleDateString()}`;
        }
    }
}

// Add click event to flip card
document.getElementById('currentCard').addEventListener('click', function() {
    this.classList.toggle('flipped');
});

function nextCard() {
    if (currentCardIndex < cardsData.length - 1) {
        currentCardIndex++;
        showCard(currentCardIndex);
    }
}

function prevCard() {
    if (currentCardIndex > 0) {
        currentCardIndex--;
        showCard(currentCardIndex);
    }
}

function rateCard(difficulty) {
    event.stopPropagation(); // Prevent card flip
    
    const cardId = cardsData[currentCardIndex].id;
    const currentDate = new Date();
    let nextReview;
    let message;
    
    // Set next review based on difficulty
    switch(difficulty) {
        case 'hard':
            // Review again in 1 day
            nextReview = new Date(currentDate.setDate(currentDate.getDate() + 1));
            message = "You'll see this card again tomorrow";
            break;
        case 'medium':
            // Review in 3 days
            nextReview = new Date(currentDate.setDate(currentDate.getDate() + 3));
            message = "You'll review this in 3 days";
            break;
        case 'easy':
            // Review in 7 days
            nextReview = new Date(currentDate.setDate(currentDate.getDate() + 7));
            message = "Great! You'll see this in a week";
            break;
    }
    
    // Store the review schedule
    reviewSchedule[cardId] = {
        lastReviewed: new Date(),
        nextReview: nextReview,
        difficulty: difficulty
    };
    
    // Save to localStorage
    localStorage.setItem(`flashcard-reviews-${cardsData[currentCardIndex].topic}`, 
        JSON.stringify(reviewSchedule));
    
    // Show feedback
    const nextReviewElement = document.getElementById('next-review');
    nextReviewElement.textContent = message;
    nextReviewElement.style.opacity = '1';
    
    // Wait a moment to show feedback before moving to next card
    setTimeout(() => {
        nextCard();
    }, 1500);
}

// Load saved review schedule when page loads
document.addEventListener('DOMContentLoaded', function() {
    const saved = localStorage.getItem(`flashcard-reviews-${cardsData[0].topic}`);
    if (saved) {
        reviewSchedule = JSON.parse(saved);
        
        // Sort cards based on review schedule if in spaced mode
        if ('{{ mode }}' === 'spaced') {
            cardsData.sort((a, b) => {
                const aReview = reviewSchedule[a.id]?.nextReview || new Date();
                const bReview = reviewSchedule[b.id]?.nextReview || new Date();
                return new Date(aReview) - new Date(bReview);
            });
        }
    }
    showCard(0);
});
</script>
{% endblock %}
