<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Flashcards</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>DevOps Flashcards</h1>
        <div class="topics-grid">
            {% for topic in topics %}
            <a href="{{ url_for('topic', topic=topic) }}" class="topic-card">
                <h2>{{ topic|upper }}</h2>
                <p>Test your knowledge</p>
            </a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
